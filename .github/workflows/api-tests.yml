name: API tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  api-integration-tests:
    name: cloudwrkz-api (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudwrkz
          POSTGRES_PASSWORD: cloudwrkz_ci
          POSTGRES_DB: cloudwrkz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudwrkz -d cloudwrkz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cloudwrkz:cloudwrkz_ci@localhost:5432/cloudwrkz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/api

      - name: Run API tests
        run: cargo test -p cloudwrkz-api
