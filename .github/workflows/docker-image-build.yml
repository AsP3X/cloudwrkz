name: Build and publish Docker images

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build-docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          # Sanitize branch name for Docker tag (no slashes, lowercase)
          SAFE_BRANCH_NAME="${BRANCH_NAME//\//-}"
          SAFE_BRANCH_NAME="${SAFE_BRANCH_NAME,,}"
          if [ "$BRANCH_NAME" = "master" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          elif [ "$BRANCH_NAME" = "dev" ]; then
            echo "TAG=preview" >> $GITHUB_OUTPUT
          else
            # For PRs from forks or other branches, use a short SHA tag
            echo "TAG=${SAFE_BRANCH_NAME}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.TAG }}
