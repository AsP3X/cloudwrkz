name: Build Docker images

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build-docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry (optional)
        if: false # Set to true and configure if you want to push images
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image tag
        id: vars
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          if [ "$BRANCH_NAME" = "master" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          elif [ "$BRANCH_NAME" = "dev" ]; then
            echo "TAG=preview" >> $GITHUB_OUTPUT
          else
            # For PRs from forks or other branches, use a short SHA tag
            echo "TAG=${BRANCH_NAME}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # Change to true if you configure a registry
          tags: |
            cloudwrkz:${{ steps.vars.outputs.TAG }}
