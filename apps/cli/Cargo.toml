[package]
name = "cloudwrkz-cli"
version = "0.1.0"
edition = "2024"
description = "CloudWrkz CLI for database and admin tasks (seed, migrate, status, stats)"

[[bin]]
name = "cloudwrkz-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1", features = ["full"] }
