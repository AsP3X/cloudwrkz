[package]
name = "cloudwrkz-cli"
version = "0.1.0"
edition = "2024"
description = "CloudWrkz CLI for database and admin tasks (seed, migrate, status, stats)"

[[bin]]
name = "cloudwrkz-cli"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.1"
crossterm = "0.29"
dotenvy = "0.15"
inquire = "0.9"
rand = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1", features = ["full"] }
