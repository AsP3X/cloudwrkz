services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    container_name: cloudwrkz-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://cloudwrkz:${POSTGRES_PASSWORD:-cloudwrkz_dev_password}@postgres:5432/cloudwrkz"
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      RUST_LOG: "info,cloudwrkz_api=debug"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudwrkz-network

  postgres:
    image: postgres:16-alpine
    container_name: cloudwrkz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudwrkz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudwrkz_dev_password}
      POSTGRES_DB: cloudwrkz
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudwrkz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudwrkz-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cloudwrkz-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloudwrkz.test
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudwrkz-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  cloudwrkz-network:
    driver: bridge
