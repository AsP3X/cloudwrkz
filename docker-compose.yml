services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    container_name: cloudwrkz-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://cloudwrkz:${POSTGRES_PASSWORD:-cloudwrkz_dev_password}@postgres:5432/cloudwrkz"
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      RUST_LOG: "info,cloudwrkz_api=debug"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudwrkz-network

  web-vite:
    build:
      context: .
      dockerfile: apps/web-vite/Dockerfile
    image: cloudwrkz-web-vite:local
    container_name: cloudwrkz-web-vite
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    environment:
      # Dev proxy only (see apps/web-vite/vite.config.ts). Do not use VITE_API_URL=http://api:… — the browser cannot resolve Docker service names.
      DOCKER_API_PROXY_TARGET: "http://api:8080"
      # Global fuzzy search uses /next-api → Next.js; add a `web` service or run apps/web on the host if you need search in this stack.
    command: >
      sh -c "cd /workspace && pnpm install && pnpm --filter web-vite dev"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cloudwrkz-network

  postgres:
    image: postgres:16-alpine
    container_name: cloudwrkz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudwrkz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudwrkz_dev_password}
      POSTGRES_DB: cloudwrkz
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudwrkz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudwrkz-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cloudwrkz-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloudwrkz.test
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudwrkz-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  cloudwrkz-network:
    driver: bridge
